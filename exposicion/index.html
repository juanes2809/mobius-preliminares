<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometría de Möbius — Preliminares y sección 2</title>
<style>
  :root {
    --bg: #0c1016;
    --ink: #f4f0e6;
    --muted: #a3adba;
    --faint: #6e7886;
    --gold: #ffd15c;
    --blue: #8eb6ff;
    --teal: #3ddecb;
    --line: rgba(244, 240, 230, 0.14);
    --card: rgba(244, 240, 230, 0.045);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #07090d;
    color: var(--ink);
  }
  body {
    display: grid;
    place-items: center;
    font-family: Lato, "Liberation Sans", sans-serif;
  }
  button, video { font: inherit; color: inherit; }
  .stage {
    container-type: inline-size;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background:
      radial-gradient(70% 46% at 0% 0%, rgba(255, 209, 92, 0.07), transparent 58%),
      radial-gradient(50% 50% at 100% 100%, rgba(106, 171, 255, 0.07), transparent 60%),
      var(--bg);
    position: relative;
    overflow: hidden;
    font-size: calc(100cqi / 40);
  }
  .progress {
    position: absolute;
    left: 0; top: 0; height: 3px;
    background: var(--gold);
    z-index: 5;
    width: 0;
  }
  .slide {
    display: none;
    position: absolute;
    inset: 0;
    padding: 0.95em 1.15em 0.72em;
    gap: 0.38em;
  }
  .slide.on {
    display: flex;
    flex-direction: column;
  }
  .slide .body { flex: 1; }
  .kicker {
    margin: 0;
    font-size: 0.34em;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h1, h2 {
    font-family: "GFS Baskerville", "Liberation Serif", Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.015em;
    margin: 0.08em 0 0;
  }
  h1 { font-size: 1.55em; line-height: 1.02; max-width: 22em; }
  .slide[data-layout="title"] h1,
  .slide[data-layout="divider"] h1,
  .slide[data-layout="close"] h1 { max-width: none; }
  .body {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 0.94fr) minmax(0, 1.12fr);
    gap: 0.7em;
    align-items: stretch;
  }
  .copy {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0.32em;
  }
  .formula {
    margin: 0;
    padding: 0.28em 0.38em;
    background: var(--card);
    border-left: 2px solid var(--gold);
    font-family: "Latin Modern Roman", "DejaVu Serif", "Liberation Serif", serif;
    font-size: 0.62em;
    line-height: 1.35;
    color: #fff8e6;
  }
  .formula small {
    display: block;
    margin-top: 0.25em;
    font-family: Lato, sans-serif;
    font-size: 0.72em;
    color: var(--muted);
  }
  ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.28em;
  }
  li {
    font-size: 0.5em;
    line-height: 1.32;
    color: #e7e2d6;
    padding-left: 0.85em;
    position: relative;
  }
  li::before {
    content: "";
    width: 0.32em;
    height: 0.32em;
    border-radius: 50%;
    background: var(--blue);
    position: absolute;
    left: 0;
    top: 0.42em;
  }
  .say {
    margin-top: auto;
    padding-top: 0.2em;
  }
  .say span {
    display: block;
    font-size: 0.28em;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 0.18em;
  }
  .say p {
    margin: 0;
    font-family: "GFS Baskerville", Georgia, serif;
    font-size: 0.5em;
    line-height: 1.28;
    color: #d7ece8;
  }
  .film {
    margin: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0.18em;
  }
  .frame {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #080b10;
    border: 1px solid var(--line);
    border-radius: 0.28em;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #0c1016;
    display: block;
  }
  .badge {
    position: absolute;
    top: 0.35em;
    right: 0.4em;
    font-size: 0.28em;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(244, 240, 230, 0.72);
    background: rgba(8, 11, 16, 0.55);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 0.28em 0.6em;
    pointer-events: none;
  }
  figcaption {
    font-size: 0.34em;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .miss {
    display: none;
    position: absolute;
    inset: 0;
    place-items: center;
    padding: 1em;
    text-align: center;
    color: var(--gold);
    font-size: 0.4em;
  }
  .foot {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.6em;
    color: var(--faint);
    font-size: 0.32em;
    letter-spacing: 0.08em;
  }
  .foot span:nth-child(2) { text-align: center; }
  .foot strong { color: var(--muted); font-weight: 600; }
  .nav {
    position: absolute;
    right: 0.4em;
    bottom: 0.28em;
    display: flex;
    gap: 0.18em;
    z-index: 4;
  }
  .nav button, .count {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 99px;
    padding: 0.15em 0.4em;
  }
  .nav button { font-size: 0.42em; }
  .nav button:hover, .count:hover { border-color: var(--line); color: var(--ink); }
  .count {
    font-size: 0.32em;
    letter-spacing: 0.12em;
  }

  .slide[data-layout="title"] .body,
  .slide[data-layout="divider"] .body,
  .slide[data-layout="close"] .body,
  .slide[data-layout="map"] .body,
  .slide[data-layout="cards"] .body {
    grid-template-columns: 1fr;
  }
  .slide[data-layout="title"] .body { align-content: end; }
  .slide[data-layout="divider"] .body,
  .slide[data-layout="close"] .body { align-content: center; }
  .hero { max-width: 16em; }
  .hero .kicker { margin-bottom: 0.4em; }
  .slide[data-layout="title"] h1 { font-size: 2.15em; line-height: 0.96; }
  .lede {
    margin: 0.35em 0 0;
    font-family: "GFS Baskerville", Georgia, serif;
    font-size: 0.72em;
    color: #e7e2d6;
  }
  .rule {
    width: 2.2em;
    height: 2px;
    background: var(--gold);
    margin: 0.45em 0 0.3em;
    border: 0;
  }
  .chapters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4em;
    align-self: end;
    margin-top: 0.4em;
  }
  .chapter {
    border-top: 1px solid var(--line);
    padding-top: 0.32em;
  }
  .chapter b {
    display: block;
    font-size: 0.34em;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .chapter span {
    display: block;
    margin-top: 0.15em;
    font-family: "GFS Baskerville", Georgia, serif;
    font-size: 0.62em;
  }
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.55em;
    align-content: center;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.28em;
    padding: 0.5em 0.55em 0.55em;
    min-height: 0;
  }
  .panel b {
    display: block;
    font-family: "GFS Baskerville", Georgia, serif;
    font-size: 0.7em;
    font-weight: 400;
    margin-bottom: 0.28em;
  }
  .panel ol {
    margin: 0;
    padding-left: 1.1em;
  }
  .panel li {
    font-size: 0.46em;
    padding-left: 0.2em;
    color: #e7e2d6;
  }
  .panel li::before { display: none; }
  .bridge {
    margin: 0;
    font-size: 0.46em;
    color: var(--muted);
    max-width: 46em;
    line-height: 1.4;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4em;
    align-content: center;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.28em;
    padding: 0.48em 0.46em 0.5em;
  }
  .card em {
    display: block;
    font-style: normal;
    font-family: "Latin Modern Roman", "DejaVu Serif", serif;
    font-size: 0.7em;
    color: var(--gold);
  }
  .card strong {
    display: block;
    margin: 0.18em 0 0.12em;
    font-family: "Latin Modern Roman", "DejaVu Serif", serif;
    font-weight: 400;
    font-size: 0.78em;
  }
  .card p { margin: 0; font-size: 0.42em; line-height: 1.35; color: var(--muted); }
  .centerpiece {
    align-self: center;
    max-width: 16em;
  }
  .slide[data-layout="divider"] h1,
  .slide[data-layout="close"] h1 { font-size: 1.9em; }
  .bigpoints { margin-top: 0.35em; }
  .bigpoints li { font-size: 0.62em; }
  .nextstep {
    margin-top: 0.55em;
    font-size: 0.46em;
    color: var(--muted);
    line-height: 1.4;
  }

  .index {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 6;
    background: rgba(7, 9, 13, 0.94);
    padding: 0.8em 1em;
    overflow: auto;
  }
  .index.on { display: block; }
  .index h2 { font-size: 0.7em; margin-bottom: 0.4em; }
  .index-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.15em 0.7em;
  }
  .index button {
    display: flex;
    gap: 0.45em;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 0.16em;
    padding: 0.16em 0.22em;
    cursor: pointer;
    color: var(--ink);
  }
  .index button:hover, .index button.here { background: var(--card); }
  .index button i {
    font-style: normal;
    color: var(--gold);
    font-size: 0.36em;
    min-width: 1.6em;
    padding-top: 0.25em;
  }
  .index button span { font-size: 0.4em; line-height: 1.3; }
  .group-label {
    grid-column: 1 / -1;
    margin: 0.35em 0 0.05em;
    font-size: 0.32em;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--teal);
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="progress" id="progress"></div>
  <div id="slides"></div>
  <div class="nav">
    <button type="button" id="prev" aria-label="Diapositiva anterior">←</button>
    <button type="button" class="count" id="count" aria-label="Índice">1 / 1</button>
    <button type="button" id="next" aria-label="Diapositiva siguiente">→</button>
  </div>
  <div class="index" id="index"></div>
</div>

];

const base = decodeURIComponent(location.href).includes("/Downloads/")
  ? "../Projects/mobius-preliminares/media/videos/"
  : "../media/videos/";

const root = document.querySelector("#slides");
const indexEl = document.querySelector("#index");

function esc(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function film(s) {
  const formula = s.formula ? `<p class="formula">${s.formula}</p>` : "";
  const points = s.points.map((p) => `<li>${esc(p)}</li>`).join("");
  return `
    <header>
      <p class="kicker">${esc(s.kicker)}</p>
      <h1>${esc(s.title)}</h1>
    </header>
    <div class="body">
      <div class="copy">
        ${formula}
        <ul>${points}</ul>
        <div class="say"><span>En voz alta</span><p>${esc(s.say)}</p></div>
      </div>
      <figure class="film">
        <div class="frame">
          <video muted playsinline loop preload="none" controls></video>
          <span class="badge">2160p · 60</span>
          <p class="miss">No se encontró el video.</p>
        </div>
        <figcaption>${esc(s.caption)}</figcaption>
      </figure>
    </div>`;
}

function titleSlide(s) {
  const chapters = s.chapters.map(([a, b]) =>
    `<div class="chapter"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("");
  return `
    <header class="hero">
      <p class="kicker">${esc(s.kicker)}</p>
      <h1>${esc(s.title)}</h1>
      <hr class="rule">
      <p class="lede">${esc(s.lede)}</p>
    </header>
    <div class="body"><div class="chapters">${chapters}</div></div>`;
}

function mapSlide(s) {
  const cols = s.cols.map(([h, items]) =>
    `<div class="panel"><b>${esc(h)}</b><ol>${items.map((it, n) => `<li>${esc(it)}</li>`).join("")}</ol></div>`).join("");
  return `
    <header>
      <p class="kicker">${esc(s.kicker)}</p>
      <h1>${esc(s.title)}</h1>
    </header>
    <div class="body">
      <div class="cols">${cols}</div>
    </div>
    <p class="bridge">${esc(s.bridge)}</p>`;
}

function cardsSlide(s) {
  const cards = s.cards.map(([h, d, p]) =>
    `<article class="card"><em>${h}</em><strong>${d}</strong><p>${esc(p)}</p></article>`).join("");
  return `
    <header>
      <p class="kicker">${esc(s.kicker)}</p>
      <h1>${esc(s.title)}</h1>
    </header>
    <div class="body">
      <div>
        <p class="bridge">${esc(s.lead)}</p>
        <div class="cards" style="margin-top:0.45em">${cards}</div>
      </div>
    </div>`;
}

function divider(s) {
  return `
    <div class="body"><div class="centerpiece">
      <p class="kicker">${esc(s.kicker)}</p>
      <h1>${esc(s.title)}</h1>
      <hr class="rule">
      <p class="lede">${esc(s.lede)}</p>
    </div></div>`;
}

function closeSlide(s) {
  return `
    <div class="body"><div class="centerpiece">
      <p class="kicker">${esc(s.kicker)}</p>
      <h1>${esc(s.title)}</h1>
      <ul class="bigpoints">${s.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
      <p class="nextstep">${esc(s.next)}</p>
    </div></div>`;
}

const builders = { film, title: titleSlide, map: mapSlide, cards: cardsSlide, divider, close: closeSlide };

SLIDES.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.dataset.layout = s.layout;
  el.setAttribute("aria-label", s.title);
  el.innerHTML = builders[s.layout](s) + `
    <div class="foot"><span>${esc(s.part)}</span><span>← → avanzar · P pausa · G índice · F pantalla</span><span></span></div>`;
  if (s.video) el.dataset.video = base + s.video;
  const video = el.querySelector("video");
  if (video) {
    video.addEventListener("error", () => {
      el.querySelector(".miss").style.display = "grid";
    });
  }
  root.appendChild(el);
});

let groups = "";
let last = "";
SLIDES.forEach((s, i) => {
  if (s.part !== last) {
    groups += `<div class="group-label">${esc(s.part)}</div>`;
    last = s.part;
  }
  groups += `<button type="button" data-go="${i}"><i>${String(i + 1).padStart(2, "0")}</i><span>${esc(s.title)}</span></button>`;
});
indexEl.innerHTML = `<h2>Índice</h2><div class="index-grid">${groups}</div>`;

const slides = [...root.children];
let current = 0;

function arm(i) {
  const el = slides[i];
  if (!el || !el.dataset.video) return;
  const video = el.querySelector("video");
  if (video.dataset.ready === "1") return;
  video.src = el.dataset.video;
  video.dataset.ready = "1";
}

function show(i) {
  current = (i + slides.length) % slides.length;
  slides.forEach((el, j) => {
    const on = j === current;
    el.classList.toggle("on", on);
    el.toggleAttribute("hidden", !on);
    const video = el.querySelector("video");
    if (!video) return;
    if (on) {
      arm(j);
      arm(j + 1);
      video.currentTime = 0;
      video.play().catch(() => {});
    } else {
      video.pause();
    }
  });
  document.querySelector("#progress").style.width = `${((current + 1) / slides.length) * 100}%`;
  document.querySelector("#count").textContent = `${current + 1} / ${slides.length}`;
  indexEl.querySelectorAll("button").forEach((b) => {
    b.classList.toggle("here", Number(b.dataset.go) === current);
  });
  history.replaceState(null, "", "#" + (current + 1));
}

function next() { show(current + 1); }
function prev() { show(current - 1); }

document.querySelector("#next").addEventListener("click", next);
document.querySelector("#prev").addEventListener("click", prev);
document.querySelector("#count").addEventListener("click", () => indexEl.classList.toggle("on"));
indexEl.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  indexEl.classList.remove("on");
  show(Number(b.dataset.go));
});

document.addEventListener("keydown", (e) => {
  if (e.key === "g" || e.key === "G") {
    indexEl.classList.toggle("on");
    return;
  }
  if (e.key === "Escape") {
    indexEl.classList.remove("on");
    return;
  }
  if (indexEl.classList.contains("on")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
    e.preventDefault();
    next();
  } else if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") {
    e.preventDefault();
    prev();
  } else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  } else if (e.key === "p" || e.key === "P") {
    const video = slides[current].querySelector("video");
    if (!video) return;
    if (video.paused) video.play();
    else video.pause();
  }
});

document.querySelector("#stage").addEventListener("click", (e) => {
  if (e.target.closest("video, button, .index, a")) return;
  const r = document.querySelector("#stage").getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (x > 0.78) next();
  else if (x < 0.16) prev();
});

const start = Math.max(1, parseInt(location.hash.slice(1), 10) || 1);
show(start - 1);
</script>
</body>
</html>
