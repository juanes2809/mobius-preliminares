<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometría de Möbius — Notas breves</title>
<style>
  :root {
    --paper: #f7f3ec;
    --ink: #2c3144;
    --muted: #6f6a78;
    --lilac: #6d5a8e;
    --terra: #c47b62;
    --sage: #2f7d64;
    --sky: #345f86;
    --wash: #efe8f6;
    --peach: #f6e3d4;
    --mint: #e4f1ea;
    --skywash: #e4eef6;
    --butter: #f6f0d8;
    --line: rgba(44, 49, 68, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e7e1d6; }
  body {
    display: grid;
    place-items: center;
    font-family: Lato, "Liberation Sans", sans-serif;
    color: var(--ink);
  }
  button, video { font: inherit; color: inherit; }
  .stage {
    container-type: inline-size;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: var(--paper);
    position: relative;
    overflow: hidden;
    font-size: calc(100cqi / 28);
  }
  .bar {
    position: absolute; left: 0; top: 0; height: 4px;
    background: var(--lilac); width: 0; z-index: 4;
  }
  .slide {
    display: none;
    position: absolute;
    inset: 0;
    padding: 0.5em 0.7em 0.4em;
  }
  .slide.on { display: flex; flex-direction: column; gap: 0.26em; }
  .kicker {
    margin: 0;
    font-size: 0.36em;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--lilac);
  }
  h1 {
    margin: 0.06em 0 0;
    font-family: "GFS Baskerville", "Liberation Serif", Georgia, serif;
    font-weight: 400;
    font-size: 1.42em;
    line-height: 1.02;
    letter-spacing: -0.02em;
  }
  .math {
    font-family: "Latin Modern Roman", "DejaVu Serif", "Liberation Serif", serif;
  }
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    line-height: 1.05;
    margin: 0 0.12em;
  }
  .frac i { border-bottom: 1.5px solid currentColor; padding: 0 0.28em 0.06em; font-style: normal; }
  .frac b { font-weight: 400; padding-top: 0.06em; }
  .say {
    margin: 0;
    font-family: "GFS Baskerville", Georgia, serif;
    font-style: italic;
    color: var(--sage);
    font-size: 0.52em;
    line-height: 1.3;
  }
  .foot {
    margin-top: auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    color: #9a948a;
    font-size: 0.3em;
    letter-spacing: 0.08em;
  }
  .foot span:nth-child(2) { text-align: center; }
  .nav {
    position: absolute; right: 0.35em; bottom: 0.22em; z-index: 5;
    display: flex; gap: 0.12em; align-items: center;
  }
  .nav button {
    background: transparent; border: 0; cursor: pointer;
    color: var(--muted); border-radius: 99px; padding: 0.12em 0.32em;
  }
  .nav button:hover { background: rgba(44, 49, 68, 0.06); }
  #count { font-size: 0.3em; letter-spacing: 0.12em; }
  #prev, #next { font-size: 0.4em; }
  video { width: 100%; height: 100%; object-fit: contain; background: #f6f1e8; display: block; }
  .frame {
    position: relative; min-height: 0; border-radius: 0.28em; overflow: hidden;
    background: #f3eee6; border: 1px solid var(--line);
  }
  .frame .miss {
    display: none; position: absolute; inset: 0; place-items: center;
    padding: 1em; text-align: center; color: var(--lilac); font-size: 0.4em;
  }
  figcaption { margin: 0.12em 0 0; font-size: 0.32em; color: var(--muted); }

  /* título */
  .title-grid {
    flex: 1; display: grid; grid-template-columns: 1.15fr 0.85fr; min-height: 0;
  }
  .title-grid > div:first-child { display: flex; flex-direction: column; justify-content: center; }
  .lede { margin: 0.28em 0 0; font-size: 0.68em; max-width: 16em; line-height: 1.3; }
  .ornament { position: relative; }
  .blob {
    position: absolute; border-radius: 50%;
  }
  .blob.a { width: 4.6em; height: 4.6em; right: 0.2em; top: 0.55em; background: var(--wash); }
  .blob.b { width: 2.3em; height: 2.3em; right: 1.35em; top: 1.7em; background: var(--peach); }
  .blob.c { width: 1.15em; height: 1.15em; right: 3.3em; top: 3.5em; background: var(--mint); }
  .parts {
    position: absolute; left: 0.2em; right: 0.3em; bottom: 0.15em;
    display: flex; flex-direction: column; gap: 0.28em;
  }
  .parts div { border-top: 1px solid var(--line); padding-top: 0.16em; }
  .parts b {
    display: block; font-size: 0.3em; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--terra); font-weight: 700;
  }
  .parts span { font-family: "GFS Baskerville", Georgia, serif; font-size: 0.58em; }

  /* plan */
  .bands { flex: 1; display: flex; flex-direction: column; gap: 0.28em; min-height: 0; }
  .band {
    flex: 1; border-radius: 0.28em; display: grid;
    grid-template-columns: auto 1fr; gap: 0.45em; align-items: center;
    padding: 0.28em 0.5em;
  }
  .band em {
    font-family: "GFS Baskerville", Georgia, serif; font-style: normal;
    font-size: 1.35em; color: var(--lilac);
  }
  .band strong { display: block; font-size: 0.64em; font-weight: 700; }
  .band p { margin: 0.08em 0 0; font-size: 0.5em; color: var(--muted); }
  .band > div { display: flex; flex-direction: column; }
  .band:nth-child(2) { direction: rtl; }
  .band:nth-child(2) > * { direction: ltr; }
  .band:nth-child(2) > div { align-items: flex-end; text-align: right; }

  /* película al lado */
  .split { flex: 1; min-height: 0; display: grid; gap: 0.45em; }
  .split.video-left { grid-template-columns: 1.15fr 0.85fr; }
  .split.video-right { grid-template-columns: 0.9fr 1.15fr; }
  .split .copy { display: flex; flex-direction: column; justify-content: space-evenly; gap: 0.22em; min-height: 0; flex: 1; }
  .copy ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.28em; justify-content: space-evenly; flex: 1; }
  .copy li { font-size: 0.5em; line-height: 1.32; padding-left: 0.7em; position: relative; }
  .copy li::before {
    content: ""; width: 0.28em; height: 0.28em; border-radius: 50%;
    background: var(--terra); position: absolute; left: 0; top: 0.38em;
  }
  .formula {
    margin: 0; padding: 0.28em 0.34em; background: var(--butter);
    font-size: 0.62em; line-height: 1.35;
  }
  .split .film { margin: 0; min-height: 0; display: flex; flex-direction: column; }
  .split .frame { flex: 1; }

  /* libro de cuentas */
  .ledger {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.55em;
    min-height: 0; align-content: center;
  }
  .ledger article { padding: 0.2em 0.15em; display: flex; flex-direction: column; justify-content: center; }
  .ledger h2 {
    margin: 0 0 0.25em; font-size: 0.55em; font-weight: 700; letter-spacing: 0.04em;
  }
  .ledger .yes h2 { color: var(--sage); }
  .ledger .no h2 { color: var(--terra); }
  .ledger ul { margin: 0; padding: 0; list-style: none; }
  .ledger li {
    font-family: "Latin Modern Roman", "DejaVu Serif", serif;
    font-size: 0.95em; padding: 0.28em 0; border-bottom: 1px solid var(--line);
  }
  .aside-note { font-size: 0.4em; color: var(--muted); margin: 0; }

  /* glosario */
  .terms { flex: 1; display: grid; grid-template-columns: 1.1fr 0.9fr 0.9fr; gap: 0.4em; align-items: stretch; }
  .terms article {
    border-top: 2px solid var(--lilac); padding: 0.3em 0.08em;
    display: flex; flex-direction: column; justify-content: center;
  }
  .terms article:nth-child(2) { border-color: var(--terra); }
  .terms article:nth-child(3) { border-color: var(--sage); }
  .terms h2 { margin: 0; font-family: "GFS Baskerville", Georgia, serif; font-size: 0.78em; font-weight: 400; }
  .terms p { margin: 0.18em 0 0; font-size: 0.5em; line-height: 1.35; color: #3d4254; }
  .punch {
    margin: 0; padding: 0.28em 0.35em; background: var(--skywash);
    font-size: 0.52em; line-height: 1.35;
  }

  /* fracción protagonista */
  .hero-formula {
    margin: 0.08em 0;
    font-size: 1.15em; text-align: center;
  }
  .wide-film { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .wide-film .frame { flex: 1; }
  .trio {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.3em; margin-top: 0.15em;
  }
  .trio p { margin: 0; font-size: 0.38em; line-height: 1.3; }
  .trio b { display: block; font-size: 0.85em; color: var(--lilac); letter-spacing: 0.08em; text-transform: uppercase; }

  /* isomorfismo */
  .iso {
    flex: 1; display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 0.4em;
    align-items: stretch; min-height: 0;
  }
  .iso-eq {
    font-size: 1.45em; line-height: 1.15;
    display: flex; flex-direction: column; justify-content: center;
  }
  .iso-eq span { display: block; }
  .iso aside {
    background: var(--peach); border-radius: 0.3em; padding: 0.55em 0.58em;
    display: flex; flex-direction: column; justify-content: space-evenly;
  }
  .iso aside p { margin: 0; font-size: 0.58em; line-height: 1.4; }

  /* generadores en escalera */
  .stairs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.2em; }
  .stairs li { font-size: 0.62em; }
  .stairs li:nth-child(2) { margin-left: 0.6em; }
  .stairs li:nth-child(3) { margin-left: 1.2em; }
  .decomp { margin: 0.08em 0 0; font-size: 0.58em; line-height: 1.35; text-align: center; color: #3d4254; }

  /* tres puntos */
  .rail { display: flex; flex-direction: column; justify-content: space-evenly; gap: 0.28em; min-height: 0; flex: 1; }
  .fact {
    margin: 0; font-size: 0.52em; line-height: 1.32;
    padding-left: 0.3em; border-left: 3px solid var(--lilac);
  }

  /* ecuación en panel */
  .panel {
    background: var(--mint); border-radius: 0.3em; padding: 0.4em 0.4em 0.45em;
    display: flex; flex-direction: column; gap: 0.25em; justify-content: center;
  }
  .panel .eq { margin: 0; font-size: 0.62em; line-height: 1.35; }
  .case { margin: 0; font-size: 0.5em; line-height: 1.3; }
  .case b { color: var(--sage); }

  /* inversión */
  .disc-wrap { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.32em; min-width: 0; }
  .disc-row { display: grid; grid-template-columns: auto 1fr; gap: 0.4em; align-items: center; }
  .disc { width: 2.7em; height: 2.7em; border-radius: 50%; background: var(--peach); display: grid; place-items: center; }
  .disc span { font-size: 0.58em; }
  .disc-notes p, .disc-note { margin: 0; font-size: 0.48em; line-height: 1.34; }
  .disc-notes { display: flex; flex-direction: column; gap: 0.28em; }
  .deriv { margin: 0.04em 0 0; font-size: 0.46em; }

  /* razón */
  .symbol { font-size: 1.05em; line-height: 1; margin: 0.08em 0; }
  .marks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.28em; justify-content: space-evenly; }
  .marks li { font-size: 0.48em; line-height: 1.3; display: grid; grid-template-columns: auto 1fr; gap: 0.35em; }
  .marks i {
    font-style: normal; font-weight: 700; color: var(--lilac); font-size: 0.9em;
  }

  /* cuaderno */
  .notebook {
    flex: 1; display: grid; grid-template-columns: 0.7fr 1.3fr 0.8fr;
    gap: 0.3em; align-items: center; min-height: 0;
  }
  .notebook .center-eq { text-align: center; font-size: 1.15em; line-height: 1.3; }
  .margin-note { margin: 0 0 0.4em; font-size: 0.48em; line-height: 1.32; color: #3d4254; }
  .margin-note b { display: block; color: var(--terra); font-size: 0.85em; letter-spacing: 0.06em; text-transform: uppercase; }

  /* cuatro tipos */
  .types { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.14em; }
  .type {
    flex: 1; border-radius: 0.22em; padding: 0.14em 0.32em;
    display: flex; flex-direction: column; justify-content: center; min-height: 0;
  }
  .type b { display: block; font-size: 0.44em; }
  .type span { font-size: 0.38em; color: #3d4254; }
  .type:nth-child(1) { background: var(--peach); }
  .type:nth-child(2) { background: var(--skywash); }
  .type:nth-child(3) { background: var(--mint); }
  .type:nth-child(4) { background: var(--wash); }
  .trace .copy { justify-content: flex-start; gap: 0.16em; }

  /* cierre */
  .close-grid {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.45em; min-height: 0; align-items: start; align-content: center;
  }
  .keep, .drop { border-radius: 0.3em; padding: 0.4em 0.42em; }
  .keep { background: var(--mint); }
  .drop { background: transparent; border: 1px solid var(--line); }
  .keep h2, .drop h2 {
    margin: 0 0 0.22em; font-family: "GFS Baskerville", Georgia, serif;
    font-weight: 400; font-size: 0.85em;
  }
  .keep li, .drop li { font-size: 0.52em; line-height: 1.4; margin: 0.16em 0; }
  .horizon { margin: 0; font-size: 0.38em; color: var(--muted); line-height: 1.4; }

  /* dos fórmulas, una frente a la otra */
  .pair {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.45em;
    align-content: center; min-height: 0;
  }
  .pair article {
    border-radius: 0.3em; padding: 0.42em 0.4em;
    display: flex; flex-direction: column; justify-content: center; gap: 0.22em;
  }
  .pair article:first-child { background: var(--skywash); }
  .pair article:last-child { background: var(--peach); }
  .pair h2 {
    margin: 0; font-family: "GFS Baskerville", Georgia, serif;
    font-weight: 400; font-size: 0.72em;
  }
  .pair p { margin: 0; font-size: 0.5em; line-height: 1.4; }
  .pair .math { font-size: 0.68em; }

  /* una sola frase, para un teorema */
  .statement { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.35em; }
  .statement h1 { font-size: 1.7em; line-height: 1.06; max-width: 16em; }

  .thanks {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; gap: 0.15em;
  }
  .thanks h1 { font-size: 3.4em; line-height: 0.95; }
  .thanks .lede { font-size: 0.72em; max-width: none; }

  .quiz { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 0.22em; }
  .quiz .terms { align-items: center; }
  .quiz .terms article { border-top-width: 3px; padding-top: 0.4em; }
  .quiz .terms h2 { font-size: 1.7em; }
  .quiz .terms p { font-size: 0.78em; }
  .quiz .pair { align-content: stretch; }
  .quiz .pair h2 { font-size: 0.95em; }
  .quiz .pair p { font-size: 0.52em; }
  .quiz .pair p.dato { font-size: 0.92em; line-height: 1.35; }

  .index {
    display: none; position: absolute; inset: 0; z-index: 6;
    background: rgba(247, 243, 236, 0.97); padding: 0.7em 0.9em; overflow: auto;
  }
  .index.on { display: block; }
  .index h2 { font-family: "GFS Baskerville", Georgia, serif; font-weight: 400; font-size: 0.7em; margin: 0 0 0.3em; }
  .index-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.08em 0.5em; }
  .index button {
    display: flex; gap: 0.4em; width: 100%; text-align: left;
    background: transparent; border: 0; border-radius: 0.14em; padding: 0.12em 0.16em; cursor: pointer;
  }
  .index button:hover, .index button.here { background: var(--wash); }
  .index i { font-style: normal; color: var(--terra); font-size: 0.34em; min-width: 1.5em; padding-top: 0.2em; }
  .index button span { font-size: 0.38em; line-height: 1.3; }
  .glabel {
    grid-column: 1 / -1; margin: 0.28em 0 0.04em;
    font-size: 0.3em; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sage);
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bar" id="bar"></div>
  <div id="slides"></div>
  <div class="nav">
    <button type="button" id="prev" aria-label="Anterior">←</button>
    <button type="button" id="count" aria-label="Índice">1</button>
    <button type="button" id="next" aria-label="Siguiente">→</button>
  </div>
  <div class="index" id="index"></div>
</div>
<script>
const base = decodeURIComponent(location.href).includes("/Downloads/")
  ? "../Projects/mobius-preliminares/media/videos/notas_breves/1080p60/"
  : "../media/videos/notas_breves/1080p60/";

const slides = [
  {
    part: "Apertura", title: "Geometría de Möbius",
    html: `
      <div class="title-grid">
        <div>
          <p class="kicker">Notas breves de seminario</p>
          <h1>Geometría de Möbius</h1>
          <p class="lede">El grupo, sus círculos y su invariante.</p>
        </div>
        <div class="ornament">
          <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
          <div class="parts">
            <div><b>I · Preliminares</b><span>La esfera y el lenguaje de acciones</span></div>
            <div><b>II · El grupo</b><span>Matrices, generadores y tres puntos</span></div>
            <div><b>III · La geometría</b><span>Círculos, razón cruzada y traza</span></div>
          </div>
        </div>
      </div>`
  },
  {
    part: "Apertura", title: "Plan de las notas",
    html: `
      <p class="kicker">Recorrido</p>
      <h1>Tres partes, un grupo</h1>
      <div class="bands">
        <div class="band" style="background:var(--skywash)">
          <em>I</em>
          <div><strong>Preliminares mínimos</strong><p>Ĉ = ℂ ∪ {∞}, la proyección estereográfica, acciones y cocientes.</p></div>
        </div>
        <div class="band" style="background:var(--peach)">
          <em>II</em>
          <div><strong>Las transformaciones</strong><p>f<sub>A</sub>(z) = (az+b)/(cz+d), el isomorfismo con PSL y los tres generadores.</p></div>
        </div>
        <div class="band" style="background:var(--mint)">
          <em>III</em>
          <div><strong>La geometría</strong><p>Círculos generalizados, ángulos, la razón cruzada y la traza.</p></div>
        </div>
      </div>
      <p class="say">La idea de la hora: matrices 2×2 que mueven la esfera y conservan círculos, ángulos y una razón.</p>`
  },
  {
    part: "Parte I", title: "La esfera de Riemann",
    video: "EsferaDeRiemann.mp4",
    caption: "La esfera en el espacio. El punto se acerca al polo norte y su sombra en el plano se aleja.",
    html: `
      <div class="split video-left">
        <figure class="film"><div class="frame"><video muted playsinline loop preload="none" controls></video><p class="miss">Falta la animación.</p></div><figcaption></figcaption></figure>
        <div class="copy">
          <p class="kicker">1 · Esfera de Riemann</p>
          <h1>El infinito es un punto de la esfera</h1>
          <p class="formula math">Ĉ = ℂ ∪ {∞}</p>
          <p class="fact">El polo norte no es un punto del plano. La proyección lo declara el infinito, y la esfera queda completa.</p>
          <p class="say">Sigan el punto que se acerca al polo: en el plano no tiene a dónde ir, salvo al infinito.</p>
        </div>
      </div>`
  },
  {
    part: "Parte I", title: "Ida y vuelta",
    html: `
      <p class="kicker">1.2 · Proyección estereográfica</p>
      <h1>De la esfera al plano, y de vuelta</h1>
      <div class="pair">
        <article>
          <h2>Hacia el plano</h2>
          <p class="math">π(x₁, x₂, x₃) = <span class="frac"><i>x₁ + i x₂</i><b>1 − x₃</b></span></p>
          <p>El polo norte no tiene imagen finita: π(N) = ∞.</p>
        </article>
        <article>
          <h2>Hacia la esfera</h2>
          <p class="math">π⁻¹(z) = <span class="frac"><i>(2 Re z, 2 Im z, |z|² − 1)</i><b>|z|² + 1</b></span></p>
          <p>Las dos son continuas, y una deshace a la otra.</p>
        </article>
      </div>
      <p class="say">Así π es un homeomorfismo: S² y Ĉ son el mismo espacio.</p>`
  },
  {
    part: "Parte I", title: "Ejercicio: la proyección",
    html: `
      <div class="quiz">
        <p class="kicker">1.2 · Ejercicio</p>
        <h1>Bajar dos, y subir otros dos</h1>
        <div class="pair">
          <article>
            <h2>De la esfera al plano</h2>
            <p>Halle π de cada punto.</p>

  el.innerHTML = s.html + `<div class="foot"><span>${s.part}</span><span>← → · G índice · F pantalla · P pausa</span><span></span></div>`;
  if (s.video) {
    el.dataset.video = base + s.video;
    const cap = el.querySelector("figcaption");
    if (cap) cap.textContent = s.caption;
    const video = el.querySelector("video");
    video.addEventListener("error", () => { el.querySelector(".miss").style.display = "grid"; });
  }
  root.appendChild(el);
});

const indexEl = document.querySelector("#index");
let last = "", buttons = "";
slides.forEach((s, i) => {
  if (s.part !== last) {
    buttons += `<div class="glabel">${s.part}</div>`;
    last = s.part;
  }
  buttons += `<button type="button" data-go="${i}"><i>${String(i + 1).padStart(2, "0")}</i><span>${s.title}</span></button>`;
});
indexEl.innerHTML = `<h2>Índice</h2><div class="index-grid">${buttons}</div>`;

const nodes = [...root.children];
let current = 0;

function arm(i) {
  const el = nodes[i];
  if (!el || !el.dataset.video) return;
  const video = el.querySelector("video");
  if (!video || video.dataset.ready === "1") return;
  video.src = el.dataset.video;
  video.dataset.ready = "1";
}
function show(i) {
  current = (i + nodes.length) % nodes.length;
  nodes.forEach((el, j) => {
    const on = j === current;
    el.classList.toggle("on", on);
    const video = el.querySelector("video");
    if (!video) return;
    if (on) {
      arm(j); arm(j + 1);
      video.currentTime = 0;
      video.play().catch(() => {});
    } else video.pause();
  });
  document.querySelector("#bar").style.width = ((current + 1) / nodes.length * 100) + "%";
  document.querySelector("#count").textContent = (current + 1) + " / " + nodes.length;
  indexEl.querySelectorAll("button").forEach((b) => b.classList.toggle("here", Number(b.dataset.go) === current));
  history.replaceState(null, "", "#" + (current + 1));
}
const next = () => show(current + 1);
const prev = () => show(current - 1);
document.querySelector("#next").onclick = next;
document.querySelector("#prev").onclick = prev;
document.querySelector("#count").onclick = () => indexEl.classList.toggle("on");
indexEl.onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  indexEl.classList.remove("on");
  show(Number(b.dataset.go));
};
document.addEventListener("keydown", (e) => {
  if (e.key === "g" || e.key === "G") { indexEl.classList.toggle("on"); return; }
  if (e.key === "Escape") { indexEl.classList.remove("on"); return; }
  if (indexEl.classList.contains("on")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "Backspace" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(nodes.length - 1);
  else if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  } else if (e.key === "p" || e.key === "P") {
    const video = nodes[current].querySelector("video");
    if (!video) return;
    if (video.paused) video.play(); else video.pause();
  }
});
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
window.addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n) show(n - 1);
});
</script>
</body>
</html>
